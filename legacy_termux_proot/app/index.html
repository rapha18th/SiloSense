<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiloSense</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    max-width: 480px; margin: 0 auto; padding: 24px 20px 60px;
    background: #0f1410; color: #eef4ee;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: #9fb0a3; font-size: 0.9rem; margin-bottom: 28px; }
  button#recordBtn {
    width: 100%; padding: 22px; font-size: 1.1rem; font-weight: 600;
    border-radius: 16px; border: none; cursor: pointer;
    background: #2f6f4e; color: white; transition: background 0.15s;
  }
  button#recordBtn.recording { background: #b45309; }
  button#recordBtn:disabled { opacity: 0.6; }
  .result {
    margin-top: 24px; padding: 18px; border-radius: 14px;
    background: #182018; border: 1px solid #2a352a; display: none;
  }
  .result.show { display: block; }
  .result.infested { border-color: #b45309; background: #241a10; }
  .badge { font-size: 1.3rem; font-weight: 700; }
  .badge.clean { color: #6fcf97; }
  .badge.infested { color: #f2a65a; }
  .metrics { margin-top: 10px; font-size: 0.85rem; color: #9fb0a3; line-height: 1.5; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 0.8rem; }
  .bar-track { flex: 1; height: 8px; background: #2a352a; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: #2f6f4e; }
  .status { margin-top: 16px; font-size: 0.85rem; color: #9fb0a3; min-height: 1.2em; }
</style>
</head>
<body>
  <h1>SiloSense</h1>
  <div class="sub">Tap, record ~2s of grain-sack audio, get an on-device infestation read — INT8 model, Arm-optimized runtime, running locally on this phone.</div>

  <button id="recordBtn">Hold to record</button>
  <div class="status" id="status"></div>

  <div class="result" id="result">
    <div class="badge" id="badge"></div>
    <div class="bar-row">
      <span style="width:60px">clean</span>
      <div class="bar-track"><div class="bar-fill" id="barClean"></div></div>
      <span id="pClean"></span>
    </div>
    <div class="bar-row">
      <span style="width:60px">infested</span>
      <div class="bar-track"><div class="bar-fill" id="barInfested" style="background:#b45309"></div></div>
      <span id="pInfested"></span>
    </div>
    <div class="metrics" id="metrics"></div>
  </div>

<script>
const btn = document.getElementById('recordBtn');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const badgeEl = document.getElementById('badge');
const metricsEl = document.getElementById('metrics');

let mediaRecorder, chunks = [];

async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  chunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e => chunks.push(e.data);
  mediaRecorder.onstop = onStop;
  mediaRecorder.start();
  btn.classList.add('recording');
  btn.textContent = 'Recording... release to stop';
  statusEl.textContent = '';
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
  btn.classList.remove('recording');
  btn.textContent = 'Hold to record';
}

// The MediaRecorder's native output (audio/webm+Opus) can't be read by
// plain `soundfile` on the server — decoding it there would need
// ffmpeg/librosa, which we deliberately avoided (see features.py). Chrome's
// Web Audio API *can* decode webm/Opus natively, so we decode to raw PCM
// here and hand-encode a plain WAV file client-side instead — the server
// only ever has to read WAV.
function encodeWav(audioBuffer) {
  const numChannels = 1;
  const sampleRate = audioBuffer.sampleRate;
  const samples = audioBuffer.getChannelData(0); // mono
  const bytesPerSample = 2;
  const blockAlign = numChannels * bytesPerSample;
  const dataSize = samples.length * bytesPerSample;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  const writeStr = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);       // PCM fmt chunk size
  view.setUint16(20, 1, true);        // PCM format
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bytesPerSample * 8, true);
  writeStr(36, 'data');
  view.setUint32(40, dataSize, true);

  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buffer], { type: 'audio/wav' });
}

async function onStop() {
  const webmBlob = new Blob(chunks, { type: 'audio/webm' });
  statusEl.textContent = 'Decoding audio...';
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const arrayBuffer = await webmBlob.arrayBuffer();
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
  const blob = encodeWav(audioBuffer);
  await audioCtx.close();

  statusEl.textContent = 'Running on-device inference...';
  const form = new FormData();
  form.append('audio', blob, 'clip.wav');
  try {
    const res = await fetch('/predict', { method: 'POST', body: form });
    const data = await res.json();
    if (data.error) { statusEl.textContent = 'Error: ' + data.error; return; }
    render(data);
    statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = 'Error: ' + e.message + ' (is server.py running?)';
  }
}

function render(data) {
  resultEl.classList.add('show');
  resultEl.classList.toggle('infested', data.label === 'infested');
  badgeEl.textContent = data.label === 'infested' ? 'Infestation risk detected' : 'Sounds clean';
  badgeEl.className = 'badge ' + data.label;
  document.getElementById('barClean').style.width = (data.probs.clean * 100).toFixed(0) + '%';
  document.getElementById('barInfested').style.width = (data.probs.infested * 100).toFixed(0) + '%';
  document.getElementById('pClean').textContent = (data.probs.clean * 100).toFixed(0) + '%';
  document.getElementById('pInfested').textContent = (data.probs.infested * 100).toFixed(0) + '%';
  metricsEl.innerHTML = `On-device latency: <b>${data.latency_ms} ms</b><br>Execution providers: ${data.providers.join(', ')}`;
}

btn.addEventListener('mousedown', startRecording);
btn.addEventListener('touchstart', e => { e.preventDefault(); startRecording(); });
btn.addEventListener('mouseup', stopRecording);
btn.addEventListener('touchend', e => { e.preventDefault(); stopRecording(); });
</script>
</body>
</html>
